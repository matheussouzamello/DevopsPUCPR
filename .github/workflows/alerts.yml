name: Discord Alerts

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches:
      - main

jobs:
  notify-ci-result:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send CI status to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Secret DISCORD_WEBHOOK_URL nao configurado."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from urllib import request

          emoji = ":white_check_mark:" if os.environ["CONCLUSION"] == "success" else ":x:"
          content = (
              f"{emoji} **CI finalizado**\n"
              f"Workflow: `{os.environ['WORKFLOW_NAME']}`\n"
              f"Status: `{os.environ['CONCLUSION']}`\n"
              f"Branch: `{os.environ['BRANCH']}`\n"
              f"Commit: `{os.environ['COMMIT']}`\n"
              f"Autor: `{os.environ['ACTOR']}`\n"
              f"Execucao: {os.environ['RUN_URL']}"
          )
          data = json.dumps({"content": content}).encode("utf-8")
          req = request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with request.urlopen(req) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord webhook failed: HTTP {response.status}")
          PY

  notify-main-push:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send main push alert to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Secret DISCORD_WEBHOOK_URL nao configurado."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from urllib import request

          content = (
              ":bell: **Novo push na main**\n"
              f"Repositorio: `{os.environ['REPO']}`\n"
              f"Branch: `{os.environ['BRANCH']}`\n"
              f"Commit: `{os.environ['COMMIT']}`\n"
              f"Autor: `{os.environ['ACTOR']}`"
          )
          data = json.dumps({"content": content}).encode("utf-8")
          req = request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with request.urlopen(req) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord webhook failed: HTTP {response.status}")
          PY
